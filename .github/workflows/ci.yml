name: ci
# Only main auto-triggers workflows; feature branches never do.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: typecheck harness + arms
        run: |
          bun add -d @types/bun @types/node
          bunx tsc --noEmit -p tsconfig.json
